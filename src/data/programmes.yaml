# Degree programmes referenced from courses.yaml (Universidade Lusófona), by code.
# `acronym: true` shows the code itself (with the full name as explanation and in the legend);
# otherwise the localized name is shown. Names omit the level: the Teaching section already gives it.

LEI:
  acronym: true
  name: { en: Computer Engineering, pt: Engenharia Informática }
LIG:
  acronym: true
  name: { en: Management Information Systems, pt: Informática de Gestão }
LEIRT:
  acronym: true
  name:
    en: Computer Engineering, Networks and Telecommunications
    pt: Engenharia Informática, Redes e Telecomunicações
LCID:
  acronym: true
  name: { en: Data Science, pt: Ciência de Dados }
LCMA:
  acronym: true
  name: { en: Applied Mathematics and Computing, pt: Computação e Matemática Aplicada }

