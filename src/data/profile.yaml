bio:
  - en: >-
      I am an Assistant Professor in the Department of Computer Engineering and Information Systems
      (DEISI) at Universidade Lusófona, where I teach programming and machine learning. I am also a PhD
      candidate in Informatics.
    pt: >-
      Sou Professor Assistente no Departamento de Engenharia Informática e Sistemas de Informação (DEISI)
      da Universidade Lusófona, onde leciono programação e aprendizagem automática. Sou também doutorando
      em Informática.
  - en: >-
      My research combines Natural Language Processing (NLP) with the study of how participants coordinate in
      conversation. I develop open-source tools for analysing multi-party conversations, such as ParShift
      and LACE, and study how Large Language Models (LLMs) generate scientific code. In the European project
      CresCine, I work with audience and film-industry data.
    pt: >-
      A minha investigação combina Natural Language Processing (NLP) com o estudo da coordenação entre
      participantes em conversa. Desenvolvo ferramentas open source para a análise de conversas com
      múltiplos participantes, como o ParShift e o LACE, e estudo a forma como os Large Language Models
      (LLMs) geram código científico. No projeto europeu CresCine, trabalho com dados de audiências e
      da indústria cinematográfica.

